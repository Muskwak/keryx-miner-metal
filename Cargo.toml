[package]
name = "keryx-miner"
version = "0.3.4"
edition = "2021"
license = "MIT/Apache-2.0"
repository = "https://github.com/keryx-labs/keryx-miner"
readme = "README.md"
description = "A fast CPU & GPU miner for Keryx"
categories = ["command-line-utilities"]
keywords = ["blockchain", "cli"]
# On macOS: produce a binary (keryx-miner). On iOS: produce a static library
# that gets linked into the native Swift app wrapper.
crate-type = ["bin", "staticlib"]
include = [
    "src/**/*.rs",
    "src/**/*.s",
    "proto/**",
    "Cargo.toml",
    "Cargo.lock",
    "build.rs",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "README.md",
]

[dependencies]
tonic = "0.8"
tokio = { version = "1.17", features = ["macros", "rt-multi-thread"] }
prost = "0.11"
futures-util = "0.3"
tokio-stream = {version = "0.1", features = ["net"]}
once_cell = "1"
num_cpus = "1"
rand = "0.8"
blake2b_simd = "1.0.0"
clap = { version = "3.0", features = ["color", "derive"]}
log = "0.4"
env_logger = "0.9"
keccak = { version = "0.1", optional = true }
parking = { package = "parking_lot", version = "0.12", optional = true }
tokio-util = {version = "0.7.0", features = ["codec"]}
serde_json = "1.0"
serde_repr = "0.1"
serde =  {version="1.0", features=["derive"]}
futures = "0.3.21"
bytes = "1.1.0"
async-trait = "0.1"
num = "0.4"
hex = "0.4"
keryx-inference = { path = "inference" }
secp256k1 = { version = "0.29.0", features = ["global-context"] }
semver = "1.0"
# Proof-of-Model: possession proof construction (borsh wire-format must match the node).
borsh = { version = "1", features = ["derive"] }
blake3 = "1"
# Phase-3 OPoI: SLM inference via candle. The GPU backend is selected per target —
# CUDA on Linux/Windows rigs, Metal on Apple Silicon — in the [target.*] sections below.
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
ureq = { version = "2", features = ["tls"] }
base64 = "0.22"
anyhow = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
flate2 = "1.0"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

# libloading (dlopen/dlsym) is not available on iOS — static linking only.
# Gate it behind the full-desktop feature so the iOS staticlib crate-type compiles.
[target.'cfg(not(target_os = "ios"))'.dependencies]
libloading = "0.7"

# nix (UNIX signal handling, pthread_kill) is macOS/Linux only, not available on iOS.
# On iOS the miner runs as a single-threaded foreground app; no freeze handler needed.
[target.'cfg(not(target_os = "ios"))'.dependencies.nix]
version = "0.25"

[features]
default = ["parking_lot"]
parking_lot = ["parking", "tokio/parking_lot"]
bench = []
no-asm = ["keccak"]

[target.'cfg(target_os = "windows")'.dependencies]
keccak = "0.1"
kernel32-sys = "0.2"
win32console = "0.1"

# Keccak-f1600 for Apple Silicon: no assembly implementation for aarch64,
# use the Rust keccak crate (same fallback as the `no-asm` feature and Windows).
# macOS and iOS both use aarch64 Metal — same keccak fallback.
[target.'cfg(all(target_arch = "aarch64", any(target_os = "macos", target_os = "ios")))'.dependencies]
keccak = "0.1"

# OPoI inference backend, chosen at build time. candle's `cuda` and `metal` features
# are mutually exclusive backends: CUDA for NVIDIA rigs, Metal for Apple Silicon
# (both macOS and iOS). On macOS the vendored `candle-kernels` patch below is unused
# (it is CUDA-only) and cargo will emit a harmless "patch not used" warning.
[target.'cfg(all(not(target_os = "macos"), not(target_os = "ios")))'.dependencies]
candle-core = { version = "0.9", features = ["cuda"] }
candle-transformers = { version = "0.9", features = ["cuda"] }
candle-nn = { version = "0.9", features = ["cuda"] }

# Metal backend: shared by macOS and iOS. Both platforms have native Metal.framework
# and the same GPU family (Apple Silicon unified memory).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
candle-core = { version = "0.9", features = ["metal"] }
candle-transformers = { version = "0.9", features = ["metal"] }
candle-nn = { version = "0.9", features = ["metal"] }
metal = "0.27"

[profile.release]
lto = true
codegen-units = 1

[build-dependencies]
tonic-build = { version = "0.8", default-features = false, features = ["prost", "transport"] }
cc = "1"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
sha3 = { git = "https://github.com/elichai/hashes", branch = "cSHAKE" }

[workspace]
members = ["inference", "plugins/*"]
default-members = ["."]

# Vendored candle-kernels: the upstream MoE bf16 WMMA kernels only compile for
# sm_80+, which would exclude Turing/Pascal (and thus all pre-Ampere miners) from
# inference. The vendored copy guards those kernel bodies with `#if __CUDA_ARCH__
# >= 800` so the crate builds at sm_75 (stub on older archs, real MoE on sm_80+).
[patch.crates-io]
candle-kernels = { path = "vendor/candle-kernels" }
