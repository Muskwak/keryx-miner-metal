name: Build Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    name: Android Native Library + App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install glslc (shader compiler for keryx-vulkan)
        run: sudo apt-get install -y glslc

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Android target
        run: rustup target add aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
          local-cache: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Rust cdylib (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -o android-app/app/src/main/jniLibs -t arm64-v8a -p 26 build --release --manifest-path Cargo.toml

      - name: Verify native library exists
        run: find android-app/app/src/main/jniLibs -name "libkeryx_miner.so"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No committed Gradle wrapper yet, so provision Gradle directly rather than via ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle assembleRelease
        working-directory: android-app
        run: gradle assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: keryx-miner-android-apk
          path: android-app/app/build/outputs/apk/release/*.apk

  test-linux:
    name: Rust tests (Linux, non-Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-android-test-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --release -- --skip heavy --skip gpu
